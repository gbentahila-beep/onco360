# Onco360 – mise en ligne depuis GitHub (11/11/2026)
# Lancée à la main (onglet Actions › « Mise en ligne » › Run workflow), ou par Claude à la demande de Dr Bentahila.
# Toujours depuis la branche main (copie propre du dernier enregistrement) ; rien n'est mis en ligne si le contrôle échoue.
# Clés : FIREBASE_CLE (site et règles, compte « deploiement-github ») et FIREBASE_CLE_FONCTIONS (fonctions serveur, compte
# « deploiement-fonctions », environnement GitHub « fonctions » avec approbation de Dr Bentahila) : voir docs/mise-en-ligne-github.md.
name: Mise en ligne

on:
  workflow_dispatch:
    inputs:
      quoi:
        description: "Ce qui est mis en ligne"
        type: choice
        options:
          - site
          - regles
          - site et regles
          - fonctions
          - tout
        default: site

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controle:
    name: Contrôle avant mise en ligne
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        if: contains(inputs.quoi, 'regles') || inputs.quoi == 'tout'
        with:
          distribution: temurin
          java-version: "21"
      - name: Préparer les outils
        run: |
          (cd functions && npm ci)
          (cd outils/eslint && npm ci)
          python3 -m venv tests/.venv
          tests/.venv/bin/pip install --quiet playwright
          tests/.venv/bin/python -m playwright install --with-deps chromium webkit
      - name: Préparer les émulateurs (règles)
        if: contains(inputs.quoi, 'regles') || inputs.quoi == 'tout'
        run: |
          npm install -g firebase-tools@15
          (cd tests/regles && npm ci)
          printf '#!/bin/sh\necho "$JAVA_HOME"\n' | sudo tee /usr/libexec/java_home > /dev/null
          sudo chmod +x /usr/libexec/java_home
          printf 'GOOGLE_CLIENT_SECRET=factice\n' > functions/.secret.local
      - name: Contrôle (avant-mise-en-ligne.sh)
        run: |
          if [[ "${{ inputs.quoi }}" == *regles* || "${{ inputs.quoi }}" == tout ]]; then
            bash outils/avant-mise-en-ligne.sh --navigateur --regles
          else
            bash outils/avant-mise-en-ligne.sh --navigateur
          fi
      - name: Détail des erreurs
        if: failure()
        run: for f in /tmp/onco360-*.txt; do echo "::group::$f"; tail -40 "$f"; echo "::endgroup::"; done

  mise-en-ligne:
    name: Mise en ligne (site, règles)
    needs: controle
    if: inputs.quoi != 'fonctions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clé du compte de service
        env:
          FIREBASE_CLE: ${{ secrets.FIREBASE_CLE }}
        run: |
          [ -n "$FIREBASE_CLE" ] || { echo "Secret FIREBASE_CLE absent : voir docs/mise-en-ligne-github.md"; exit 1; }
          printf '%s' "$FIREBASE_CLE" > "$RUNNER_TEMP/cle.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cle.json" >> "$GITHUB_ENV"
      - name: Mettre en ligne
        run: |
          case "${{ inputs.quoi }}" in
            site) CIBLE="hosting" ;;
            regles) CIBLE="firestore:rules" ;;
            "site et regles"|tout) CIBLE="hosting,firestore:rules" ;;
          esac
          echo "Mise en ligne : $CIBLE (enregistrement $(git rev-parse --short HEAD))"
          npx --yes firebase-tools@15 deploy --only "$CIBLE" --project chimio-hgc --non-interactive
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/cle.json"

  fonctions:
    name: Mise en ligne des fonctions serveur
    needs: [controle, mise-en-ligne]
    if: always() && needs.controle.result == 'success' && (inputs.quoi == 'fonctions' || (inputs.quoi == 'tout' && needs.mise-en-ligne.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: fonctions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Préparer
        run: cd functions && npm ci
      - name: Clé du compte de service
        env:
          FIREBASE_CLE_FONCTIONS: ${{ secrets.FIREBASE_CLE_FONCTIONS }}
        run: |
          [ -n "$FIREBASE_CLE_FONCTIONS" ] || { echo "Secret FIREBASE_CLE_FONCTIONS absent : voir docs/mise-en-ligne-github.md"; exit 1; }
          printf '%s' "$FIREBASE_CLE_FONCTIONS" > "$RUNNER_TEMP/cle.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cle.json" >> "$GITHUB_ENV"
      - name: Mettre en ligne les fonctions
        run: |
          echo "Fonctions serveur (enregistrement $(git rev-parse --short HEAD))"
          npx --yes firebase-tools@15 deploy --only functions,firestore:indexes --project chimio-hgc --non-interactive
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/cle.json"
